<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎵 Music Player</h1>
        <p class="subtitle">Мюзикл - 9 саг</p>
        
        <div id="status" class="status">⏸ Остановлено</div>
        
        <!-- Вкладки альбомов -->
        <div id="albumTabs" class="album-tabs"></div>
        
        <!-- Список песен -->
        <div id="songList" class="song-list"></div>
        
        <!-- Прогресс-бар -->
        <div class="progress-container">
            <span id="currentTime" class="time-label">00:00</span>
            <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0">
            <span id="totalTime" class="time-label">00:00</span>
        </div>
        
        <div class="controls">
            <button id="prevBtn">⏮</button>
            <button id="playBtn">▶️</button>
            <button id="nextBtn">⏭</button>
        </div>
        
        <div class="volume-container">
            <span>🔈</span>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="100">
            <span>🔊</span>
        </div>
        
        <div id="currentSong" class="current-song">🎵 Выберите песню</div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
